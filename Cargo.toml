[package]
name = "mc-motd"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Lightweight async Minecraft MOTD query library"
readme = "README.md"
repository = "https://github.com/BE-Community-Dev/mc-motd"
homepage = "https://github.com/BE-Community-Dev/mc-motd"
documentation = "https://docs.rs/mc-motd"
keywords = ["minecraft", "motd", "ping", "bedrock", "java"]
categories = ["asynchronous", "network-programming", "parser-implementations"]
exclude = [".github/", "Cargo.lock", "target/"]

[lib]
name = "mc_motd"
path = "src/lib.rs"

[features]
default = ["nethernet", "java"]
nethernet = ["dep:reqwest", "dep:serde", "dep:serde_json"]
java = ["dep:hickory-resolver"]

[dependencies]
hickory-resolver = { version = "0.25.2", default-features = false, features = ["system-config", "tokio"], optional = true }
socket2 = { version = "0.6", default-features = false }
tokio = { version = "1.48.0", default-features = false, features = ["io-util", "macros", "net", "sync", "time"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1.48.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }

[[example]]
name = "query"
required-features = ["java"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
